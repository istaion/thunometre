services:
  - type: web
    name: thunometre
    runtime: python
    # Un disque persistant est nécessaire pour garder la base SQLite entre les
    # redémarrages ; Render ne le propose pas sur le plan gratuit.
    plan: starter
    region: frankfurt
    buildCommand: echo "aucune dépendance"
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/thunometre.db
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
